name: test

on:
  # Every push onto the main branch triggers a retest.
  push:
    branches:
      - master
  # All pull_requests trigger a retest.
  pull_request:
  workflow_dispatch:

jobs:

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: ['15', '26']
        libvvp: [true]
        suffix: [true]
    runs-on: macos-${{ matrix.os }}-intel
    name: 🍏 macOS ${{ matrix.os }}${{ matrix.libvvp && ' +libvvp' || '' }}${{ matrix.suffix && ' +suffix' || '' }}
    steps:

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew install bison

    - name: Build, check and install
      run: |
        export PATH="/usr/local/opt/bison/bin:$PATH"
        CONFIG_OPTS="--enable-libveriuser"
        if [ "${{ matrix.libvvp }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-libvvp"
        fi
        if [ "${{ matrix.suffix }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-suffix"
        fi
        autoconf
        ./configure $CONFIG_OPTS
        make -j$(nproc) check
        sudo make install

    - name: Test
      run: |
        make check-installed


  lin:
    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04', '26.04']
        # libvvp: [false, true]
        # suffix: [false, true]
    runs-on: ubuntu-${{ matrix.os }}
    name: 🐧 Ubuntu ${{ matrix.os }}${{ matrix.libvvp && ' +libvvp' || '' }}${{ matrix.suffix && ' +suffix' || '' }}
    steps:

    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y make g++ git bison flex gperf libreadline-dev libbz2-dev autoconf python3-venv
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r Documentation/requirements.txt

    - name: Build, check and install
      run: |
        CONFIG_OPTS="--enable-libveriuser"
        if [ "${{ matrix.libvvp }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-libvvp"
        fi
        if [ "${{ matrix.suffix }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-suffix"
        fi
        autoconf
        ./configure $CONFIG_OPTS
        make -j$(nproc) check
        sudo make install

    - name: Test
      run:
        make check-installed

    - name: Documentation
      run: |
        . .venv/bin/activate
        cd Documentation
        make html

  win-arm:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        msystem: [CLANGARM64]
        # libvvp: [false, true]
        # suffix: [false, true]
        include:
          - { msystem: CLANGARM64, env: clang-aarch64 }
    name: 🪟 ${{ matrix.msystem }}${{ matrix.libvvp && ' +libvvp' || '' }}${{ matrix.suffix && ' +suffix' || '' }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MINGW_ARCH: ${{ matrix.msystem }}
    steps:

    - run: git config --global core.autocrlf input
      shell: bash

    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >
          git
          base-devel
          python-pip
          mingw-w64-${{ matrix.env }}-perl

    - uses: actions/setup-python@v7
      with:
        python-version: '>=3.5'

    - name: Build and check
      run: |
        cd msys2
        CONFIG_OPTS=""
        if [ "${{ matrix.libvvp }}" = "true" ] ; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-libvvp"
        fi
        if [ "${{ matrix.suffix }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-suffix"
        fi
        export IVL_CONFIG_OPTIONS="$CONFIG_OPTS"
        makepkg-mingw --noconfirm --noprogressbar -sCLf

    - name: Install
      run: pacman -U --noconfirm msys2/*.zst

    - name: Test
      run: |
        make check-installed

    - uses: actions/upload-artifact@v7
      with:
        name: 🪟 ${{ matrix.msystem }}${{ matrix.libvvp && ' +libvvp' || '' }}
        path: msys2/*.zst

  win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64, CLANG64]
        # libvvp: [false, true]
        # suffix: [false, true]
        include:
          - { msystem: UCRT64,  env: ucrt-x86_64 }
          - { msystem: CLANG64, env: clang-x86_64 }
    name: 🪟 ${{ matrix.msystem }}${{ matrix.libvvp && ' +libvvp' || '' }}${{ matrix.suffix && ' +suffix' || '' }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MINGW_ARCH: ${{ matrix.msystem }}
    steps:

    - run: git config --global core.autocrlf input
      shell: bash

    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >
          git
          base-devel
          python-pip
          mingw-w64-${{ matrix.env }}-perl

    - uses: actions/setup-python@v7
      with:
        python-version: '>=3.5'

    - name: Build and check
      run: |
        cd msys2
        CONFIG_OPTS=""
        if [ ${{ matrix.msystem }} != "CLANG64" ] ; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-libveriuser"
        fi
        if [ "${{ matrix.libvvp }}" = "true" ] ; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-libvvp"
        fi
        if [ "${{ matrix.suffix }}" = "true" ]; then
            CONFIG_OPTS="$CONFIG_OPTS --enable-suffix"
        fi
        export IVL_CONFIG_OPTIONS="$CONFIG_OPTS"
        makepkg-mingw --noconfirm --noprogressbar -sCLf

    - name: Install
      run: pacman -U --noconfirm msys2/*.zst

    - name: Test
      run: |
        make check-installed

    - uses: actions/upload-artifact@v7
      with:
        name: 🪟 ${{ matrix.msystem }}${{ matrix.libvvp && ' +libvvp' || '' }}
        path: msys2/*.zst

  release-macos-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    name: Release macOS ARM64
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        test "$(uname -m)" = arm64
        brew install autoconf bison
        python3 -c 'import sys; assert sys.version_info >= (3, 8)'

    - name: Build, test and package
      run: |
        export PATH="$(brew --prefix bison)/bin:$PWD/inst/bin:$PATH"
        autoconf
        ./configure --prefix="$PWD/inst" --enable-libveriuser
        make -j$(sysctl -n hw.ncpu) check
        make install
        make check-installed
        tar czf iverilog.tar.gz inst

    - uses: actions/upload-artifact@v7
      with:
        name: macOS-iverilog
        path: iverilog.tar.gz
        if-no-files-found: error

  release-rocky8:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: rockylinux:8.9.20231119
    name: Release Rocky 8 x86_64
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        test "$(uname -m)" = x86_64
        dnf install -y 'dnf-command(config-manager)'
        dnf config-manager --enable powertools -y
        dnf install -y autoconf flex bison gperf git gcc-c++ make perl bzip2-devel python39 python39-pip
        python3.9 -m venv "$PWD/.release-venv"

    - name: Build, test and package
      run: |
        export PATH="$PWD/.release-venv/bin:$PWD/inst/bin:$PATH"
        python3 -c 'import sys; assert sys.version_info >= (3, 8)'
        autoconf
        ./configure --prefix="$PWD/inst" --enable-libveriuser
        make -j$(nproc) check
        make install
        make check-installed
        tar czf iverilog.tar.gz inst

    - uses: actions/upload-artifact@v4
      with:
        name: Rocky8-iverilog
        path: iverilog.tar.gz
        if-no-files-found: error
