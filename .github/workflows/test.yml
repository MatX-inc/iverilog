name: test

on:
  # Every push onto the main branch triggers a retest.
  push:
    branches:
      - master
  # All pull_requests trigger a retest.
  pull_request:
  workflow_dispatch:

jobs:

  mac:
    runs-on: macos-15
    name: macOS
    steps:

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        brew install autoconf bison

    - name: Build, check and install
      run: |
        export PATH="$(brew --prefix bison)/bin:$PATH"
        autoconf
        ./configure --prefix=$PWD/inst
        make -j$(sysctl -n hw.ncpu) check
        make install
        tar czf iverilog.tar.gz inst

    - uses: actions/upload-artifact@v7
      with:
        name: macOS-iverilog
        path: iverilog.tar.gz


  lin:
    runs-on: ubuntu-22.04
    name: Ubuntu 22.04
    steps:

    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y make g++ git bison flex gperf libreadline-dev libbz2-dev autoconf python3-venv
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install -r Documentation/requirements.txt

    - name: Build, check and install
      run: |
        autoconf
        ./configure --prefix=$PWD/inst
        make -j$(nproc) check
        make install
        tar czf iverilog.tar.gz inst

    - uses: actions/upload-artifact@v7
      with:
        name: Ubuntu-22.04-iverilog
        path: iverilog.tar.gz

    - name: Documentation
      run: |
        . .venv/bin/activate
        cd Documentation
        make html

